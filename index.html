<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astetikk Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --bg:#FFFFFF;
    --panel:#F5F4F1;
    --ink:#121212;
    --ink-soft:#6B6B66;
    --line:#E4E2DC;
    --accent:#C7521F;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141413;
      --panel:#1C1C1A;
      --ink:#F2F1EC;
      --ink-soft:#98968E;
      --line:#2E2E2B;
      --accent:#E07A45;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141413; --panel:#1C1C1A; --ink:#F2F1EC;
    --ink-soft:#98968E; --line:#2E2E2B; --accent:#E07A45;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
  p{margin:0; color:var(--ink-soft); line-height:1.55;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 clamp(20px,4vw,48px);}

  /* ---- header ---- */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,48px); max-width:1180px; margin:0 auto;
  }
  .logo{font-size:16px; font-weight:600; letter-spacing:0.06em;}
  .logo span{color:var(--accent);}
  .nav-links{display:flex; gap:26px;}
  .nav-links a{font-size:13.5px; color:var(--ink-soft);}
  .nav-links a:hover{color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:16px;}
  .search-box{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line);
    padding:7px 12px; border-radius:2px;
  }
  .search-box input{
    border:none; background:none; font-family:inherit; font-size:13px;
    color:var(--ink); width:130px;
  }
  .search-box input:focus{outline:none;}
  .search-box input::placeholder{color:var(--ink-soft);}

  /* ---- hero ---- */
  .hero{
    padding-top:clamp(46px,7vw,88px);
    padding-bottom:clamp(30px,4vw,50px);
    padding-left:clamp(36px,7vw,88px);
    padding-right:clamp(20px,4vw,48px);
  }
  .hero h1{
    font-size:clamp(30px,4.2vw,50px); font-weight:600; letter-spacing:-0.01em;
    max-width:14ch; margin:0;
  }
  .hero p{margin-top:16px; font-size:15.5px; max-width:46ch;}

  /* ---- filters ---- */
  .filters{
    display:flex; gap:8px; flex-wrap:wrap; padding:24px 0 6px;
    border-bottom:1px solid var(--line); margin-bottom:2px;
  }
  .filter-btn{
    font-size:13px; padding:8px 15px; border:1px solid var(--line);
    border-radius:20px; color:var(--ink-soft); transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--ink); color:var(--ink);}
  .filter-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  .count-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0; font-size:13px; color:var(--ink-soft);
  }

  /* ---- grid ---- */
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line);
    margin-bottom:70px;
  }
  @media (max-width:960px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:420px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--bg); display:flex; flex-direction:column;
    cursor:pointer; transition:background .15s ease;
  }
  .card:hover{background:var(--panel);}
  .card-art{
    aspect-ratio:1/1; background:var(--panel); display:flex;
    align-items:center; justify-content:center; position:relative;
  }
  .card:hover .card-art{background:var(--bg);}
  .card-art svg{width:44%; height:44%; stroke:var(--ink); overflow:visible;}
  .card-art img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-tag{
    position:absolute; top:12px; left:12px; font-size:10.5px;
    letter-spacing:0.04em; color:var(--ink-soft); text-transform:uppercase;
  }
  .card-body{padding:16px 16px 20px;}
  .card-name{font-size:14.5px; font-weight:500;}

  .empty-state{
    padding:80px 0; text-align:center; color:var(--ink-soft); font-size:14px;
    display:none;
  }
  .empty-state.show{display:block;}

  /* ---- footer ---- */
  footer{border-top:1px solid var(--line); padding:40px 0 calc(28px + env(safe-area-inset-bottom,0px));}
  .foot-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:14px; font-size:13px; color:var(--ink-soft);
  }
  .foot-links{display:flex; gap:20px;}
  .foot-links a:hover{color:var(--ink);}

  /* ---- modal ---- */
  .scrim{
    position:fixed; inset:0; background:rgba(18,18,18,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:80;
  }
  .scrim.open{opacity:1; pointer-events:auto;}
  .modal{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-46%);
    width:min(680px,92vw); max-height:86vh; overflow-y:auto;
    background:var(--bg); border:1px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:85; border-radius:2px;
  }
  .modal.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%);}
  .modal-inner{display:grid; grid-template-columns:1fr 1fr;}
  @media (max-width:560px){ .modal-inner{grid-template-columns:1fr;} }
  .modal-art{
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1;
  }
  .modal-art svg{width:50%; height:50%; stroke:var(--ink);}
  .modal-art img{width:100%; height:100%; object-fit:cover; display:block;}
  .modal-info{padding:clamp(24px,4vw,36px); display:flex; flex-direction:column;}
  .modal-close{
    position:absolute; top:16px; right:16px; font-size:22px; line-height:1;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .modal-tag{font-size:11px; letter-spacing:0.05em; color:var(--accent); text-transform:uppercase;}
  .modal-name{font-size:24px; font-weight:600; margin-top:10px;}
  .modal-actions{margin-top:auto; padding-top:24px; display:flex; gap:10px;}
  .btn{
    display:inline-block;
    padding:12px 20px; font-size:13.5px; border:1px solid var(--ink);
    border-radius:2px; flex:1; text-align:center;
  }
  .btn-primary{background:var(--ink); color:var(--bg);}
  .btn-primary:hover{background:var(--accent); border-color:var(--accent);}
  .btn-ghost:hover{background:var(--panel);}

  ::selection{background:var(--accent); color:#fff;}

  /* ---- whatsapp button ---- */
  .whatsapp-btn{
    position:fixed;
    right:calc(20px + env(safe-area-inset-right,0px));
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    z-index:70;
    display:flex; align-items:center; gap:9px;
    background:#25D366; color:#fff;
    padding:13px 18px; border-radius:30px;
    font-size:13.5px; font-weight:500;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .whatsapp-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(0,0,0,0.22);
  }
  .whatsapp-btn svg{width:19px; height:19px; flex-shrink:0;}
  @media (max-width:480px){
    .whatsapp-btn span{display:none;}
    .whatsapp-btn{padding:13px; border-radius:50%;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="#top">Astetikk<span>.</span></a>
    <nav class="nav-links">
      <a href="#catalog">Catalog</a>
    </nav>
    <div class="nav-right">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search pieces">
      </div>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero wrap">
    <h1>From Guangzhou to You, anywhere in the world</h1>
    <p>Only the best quality you deserve.</p>
  </section>

  <section class="wrap" id="catalog">
    <div class="filters" id="filters"></div>
    <div class="count-row"><span id="countLabel">11 pieces</span><span id="about">Updated seasonally</span></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState">No objects match your search.</div>
  </section>
</main>

<footer id="footer">
  <div class="wrap">
    <div class="foot-row">
      <span>© 2026 Astetikk. All pieces shown are samples.</span>
      <div class="foot-links">
        <a href="#catalog">Catalog</a>
      </div>
    </div>
  </div>
</footer>

<a class="whatsapp-btn" href="https://wa.me/8618941315597" target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.868-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2.003c-5.514 0-9.997 4.483-9.997 9.997 0 1.762.462 3.484 1.34 5.003L2 22l5.116-1.342a9.96 9.96 0 0 0 4.888 1.245h.004c5.514 0 9.997-4.483 9.997-9.997 0-2.671-1.04-5.182-2.929-7.071a9.935 9.935 0 0 0-7.072-2.832zm0 18.187h-.003a8.19 8.19 0 0 1-4.176-1.144l-.3-.178-3.037.796.811-2.962-.195-.304a8.176 8.176 0 0 1-1.256-4.371c0-4.522 3.68-8.202 8.204-8.202a8.15 8.15 0 0 1 5.802 2.404 8.15 8.15 0 0 1 2.399 5.805c0 4.523-3.68 8.203-8.203 8.203z"/></svg>
  <span>Chat on WhatsApp</span>
</a>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal">
  <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
  <div class="modal-inner">
    <div class="modal-art" id="modalArt"></div>
    <div class="modal-info">
      <div class="modal-tag" id="modalTag"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-actions">
        <a class="btn btn-primary" href="https://wa.me/8618941315597" target="_blank" rel="noopener noreferrer">Request info</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){

  var PRODUCTS = [
    { id:'p1', name:'Alo Gym Bag', cat:'Bags', img:'images/p1.jpg' },
    { id:'p2', name:'Channel 26Autumn', cat:'Handbags', img:'images/p2.jpg' },
    { id:'p3', name:'Channel 26CAutumn', cat:'Handbags', img:'images/p3.jpg' },
    { id:'p4', name:'Channel 26CAutumn', cat:'Handbags', img:'images/p4.jpg' },
    { id:'p5', name:'Dior', cat:'Handbags', img:'images/p5.jpg' },
    { id:'p6', name:'Channel 26BAutumn', cat:'Handbags', img:'images/p6.jpg' },
    { id:'p7', name:'LV Suitcase', cat:'Suitcases', img:'images/p7.jpg' },
    { id:'p8', name:'Channel 26B Series', cat:'Handbags', img:'images/p8.jpg' },
    { id:'p9', name:'Channel PreppyCoco', cat:'Handbags', img:'images/p9.jpg' },
    { id:'p10', name:'Chanel Maxi Flap Bag', cat:'Handbags', img:'images/p10.jpg' },
    { id:'p11', name:'BV Getaway Bag', cat:'Bags', img:'images/p11.jpg' },
    { id:'p12', name:'BV Portfolio Bag', cat:'Bags', img:'images/p12.jpg' },
    { id:'p13', name:'BV Intrecciato Bag', cat:'Bags', img:'images/p13.jpg' },
    { id:'p14', name:'BV PICCOLO PORTFOLIO Bag', cat:'Bags', img:'images/p14.jpg' },
    { id:'p15', name:'BV Clutch Bag', cat:'Bags', img:'images/p15.jpg' },
    { id:'p16', name:'BV Laptop Bag', cat:'Bags', img:'images/p16.jpg' },
    { id:'p17', name:'YSL Kate', cat:'Handbags', img:'images/p17.jpg' },
    { id:'p18', name:'Coach Hudson', cat:'Bags', img:'images/p18.jpg' },
    { id:'p19', name:'Chanel 26P Series', cat:'Handbags', img:'images/p19.jpg' },
    { id:'p20', name:'Chanel 26SS', cat:'Handbags', img:'images/p20.jpg' },
    { id:'p21', name:'Dior Lady', cat:'Handbags', img:'images/p21.jpg' },
    { id:'p22', name:'Hermes Mini Kelly', cat:'Handbags', img:'images/p22.jpg' },
    { id:'p23', name:'Hermes Constance 23cm', cat:'Handbags', img:'images/p23.jpg' },
    { id:'p24', name:'Hermes Evelyn Mini', cat:'Handbags', img:'images/p24.jpg' }
  ];

  var CATEGORIES = ['All','Bags','Hats','Shoes','Suitcases','Handbags','Sunglasses','Watches','Belts','Scarfs',"Men's Clothing","Women's Clothings"];
  var activeCat = 'All';
  var query = '';

  var filtersEl = document.getElementById('filters');
  CATEGORIES.forEach(function(cat){
    var b = document.createElement('button');
    b.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
    b.textContent = cat;
    b.dataset.cat = cat;
    filtersEl.appendChild(b);
  });

  filtersEl.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    activeCat = btn.dataset.cat;
    Array.prototype.forEach.call(filtersEl.children, function(c){
      c.classList.toggle('active', c === btn);
    });
    render();
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    query = e.target.value.trim().toLowerCase();
    render();
  });

  var grid = document.getElementById('grid');
  var countLabel = document.getElementById('countLabel');
  var emptyState = document.getElementById('emptyState');

  function render(){
    var filtered = PRODUCTS.filter(function(p){
      var matchesCat = activeCat === 'All' || p.cat === activeCat;
      var matchesQuery = !query || p.name.toLowerCase().indexOf(query) !== -1 || p.cat.toLowerCase().indexOf(query) !== -1;
      return matchesCat && matchesQuery;
    });

    countLabel.textContent = filtered.length + (filtered.length === 1 ? ' object' : ' objects');
    emptyState.classList.toggle('show', filtered.length === 0);
    grid.style.display = filtered.length === 0 ? 'none' : 'grid';

    grid.innerHTML = filtered.map(function(p){
      var art = p.img
        ? '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy">'
        : '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">' + p.icon + '</svg>';
      return (
        '<div class="card" data-id="' + p.id + '">' +
          '<div class="card-art">' +
            '<span class="card-tag">' + p.cat + '</span>' +
            art +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-name">' + p.name + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  grid.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(!card) return;
    var p = PRODUCTS.find(function(x){ return x.id === card.dataset.id; });
    openModal(p);
  });

  var scrim = document.getElementById('scrim');
  var modal = document.getElementById('modal');

  function openModal(p){
    var art = p.img
      ? '<img src="' + p.img + '" alt="' + p.name + '">'
      : '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">' + p.icon + '</svg>';
    document.getElementById('modalArt').innerHTML = art;
    document.getElementById('modalTag').textContent = p.cat;
    document.getElementById('modalName').textContent = p.name;
    scrim.classList.add('open');
    modal.classList.add('open');
  }
  function closeModal(){
    scrim.classList.remove('open');
    modal.classList.remove('open');
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  scrim.addEventListener('click', closeModal);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  render();
})();
</script>

</body>
</html>
